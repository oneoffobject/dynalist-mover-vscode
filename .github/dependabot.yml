version: 2
updates:
  # Keep devDependencies (TypeScript, types, vsce) up to date.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      # @types/vscode must track the minimum supported VS Code version
      # (engines.vscode), not the latest release. Ignore all updates here and
      # update both values together when raising the minimum supported version.
      - dependency-name: "@types/vscode"
      # @types/node must track the VS Code runtime's Node version, not the
      # latest. Ignore major bumps so Dependabot does not propose a runtime
      # version change as a routine type update.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Keep GitHub Actions versions current (avoids runtime deprecations).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
